name: SnapNotes automated checks

on:
  push:
    branches: [main, feature/snapnotes-vnext-polish]
  pull_request:
    branches: [main]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript files
        run: |
          node --check js/reminder-utils.js
          node --check js/reminder-controls.js
          node --check js/app.js
          node --check js/notes.js
          node --check js/drafts.js
          node --check js/note-format.js
          node --check js/storage.js
          node --check js/local-library.js
          node --check js/note-deletions.js
          node --check js/auth.js
          node --check js/auth-email.js
          node --check lib/auth-email.js
          node --check api/auth/email.js
          node --check lib/supabase-storage.js
          node --check api/storage/sign-upload.js
          node --check api/storage/complete-upload.js
          node --check api/storage/sign-download.js
          node --check api/storage/delete-object.js
          node --check api/storage/avatar.js
          node --check js/firestore.js
          node --check js/private-notes.js
          node --check js/private-passkey.js
          node --check js/attachments.js
          node --check js/folders.js
          node --check js/version-history.js
          node --check js/note-sync.js
          node --check js/cloud-session.js
          node --check js/private-note-utils.js
          node --check js/attachment-cleanup.js
          node --check js/settings-account.js
          node --check api/ai.js
          node --check api/ai-notes.js
          node --check api/cron/delete-scheduled-accounts.js
      - name: Validate required PWA files
        run: |
          test -f manifest.json
          test -f sw.js
          grep -q 'snapnotes-v' sw.js
      - name: Validate productivity feature contracts
        run: |
          grep -q 'noteTagsInput' index.html
          grep -q 'noteReminderInput' index.html
          # The native date/time input is the only reminder picker control.
          ! grep -q 'reminderPickerBtn' index.html
          ! grep -q 'reminderPickerBtn' js/app.js
          ! grep -q 'showPicker' js/app.js
          grep -q 'noteDetailModal' index.html
          grep -q 'function parseTags' js/app.js
          grep -q 'function openNoteDetail' js/notes.js
          grep -q 'syncConflict' js/note-sync.js
          grep -q 'CACHE_NAME = "snapnotes-v' sw.js
          grep -q 'showNotification' js/app.js
          grep -q 'notificationclick' sw.js
          grep -q 'SNAPNOTES_OPEN_NOTE' sw.js
          grep -q 'SNAPNOTES_OPEN_NOTE' js/app.js
          grep -q 'openNoteDetail' js/notes.js
          grep -q 'handlePendingNotificationNote' js/firestore.js
          grep -q 'openNoteVersionHistory' js/version-history.js
          grep -q 'openSmartShareDialog' js/notes.js
          grep -q 'shareNoteImage' js/notes.js
          grep -q 'smart-share-overlay' styles/main.css
          grep -q 'appendVersion' js/version-history.js
          grep -q 'edit history' js/notes.js
          grep -q 'history' js/private-notes.js
          grep -q 'prepareNoteAttachments' js/attachments.js
          grep -q 'MAX_ATTACHMENTS_PER_NOTE' js/attachments.js
          # Attachments must be saved locally first, with sign-in guidance and retry support.
          grep -q 'indexedDB.open' js/attachments.js
          grep -q 'uploadStatus: "pending"' js/attachments.js
          grep -q 'Sign in to your SnapNotes account' js/attachments.js
          grep -q 'retryPendingAttachmentUploads' js/attachments.js
          grep -q 'attachmentRetryQueued' js/attachments.js
          grep -q 'Uploading…' js/attachments.js
          grep -q 'Network problem' js/attachments.js
          grep -q 'addEventListener("online", retryPendingAttachmentUploads)' js/attachments.js
          grep -q 'retryPendingAttachmentUploads' js/app.js
          grep -q 'retryPendingAttachmentUploads' js/firestore.js
          grep -q 'retryPendingAttachmentUploads' js/notes.js
          grep -q 'attachment-section-title' styles/main.css
          grep -q 'body.dark-mode .attachment-section-title' styles/main.css
          grep -q 'askMyNotesInfoTooltip' index.html
          grep -q 'setInfoTooltip' js/ai.js
          grep -q 'ai-info-tooltip' styles/main.css
          ! grep -q 'window.confirm' js/ai.js
          grep -q 'storageProvider = "supabase"' js/attachments.js
          grep -q 'sign-upload' js/attachments.js
          grep -q 'sign-download' js/attachments.js
          ! grep -q 'firebase-storage.js' js/attachments.js
          ! grep -q 'firebase-storage.js' js/auth.js
          grep -q 'verifyIdToken' lib/supabase-storage.js
          test -f docs/SUPABASE_STORAGE.md
          grep -q 'js/attachments.js' index.html
          grep -q 'prepareNoteAttachments' js/attachments.js
          grep -q 'loadFolders' js/folders.js
          grep -q 'moveNoteToFolder' js/folders.js
          grep -q 'folderNavList' index.html
          grep -q 'folders' js/firestore.js
          grep -Eq 'const CACHE_NAME = "snapnotes-v[0-9]+";' sw.js
          test -f assets/icons/snapnotes-notification.png
          test -f assets/icons/snapnotes-notification-badge.png
          ! grep -q 'snapnotes-notification-badge.svg' js/app.js
          grep -q 'icon: "./assets/icons/snapnotes-notification.png"' js/app.js
          grep -q 'badge: "./assets/icons/snapnotes-notification-badge.png"' js/app.js
          grep -q 'data-view="private"' index.html
          grep -q 'isPrivate' js/notes.js
          grep -q 'AES-GCM' js/private-notes.js
          grep -q 'PBKDF2-SHA-256' js/private-notes.js
          grep -q 'extensions: { prf:' js/private-passkey.js
          grep -q 'deletedNotesVersion' js/firestore.js
          grep -q 'privateNoteMetadataNeedsMigration' js/firestore.js
          grep -q 'accountDeletionTombstones' js/firestore.js
          grep -q 'accountDeletionTombstones' api/cron/delete-scheduled-accounts.js
          grep -q 'tagLegacyAttachmentFilesForUser' js/attachments.js
          grep -q 'tagLegacyAttachmentFilesForUser' js/private-notes.js
          grep -q 'SnapNotesAccountCleanupPending:' js/auth.js
          grep -q 'SnapNotesAccountAttachmentIds:' js/auth.js
          grep -q 'CACHE_NAME = "snapnotes-v' sw.js

      - name: Run behavioral regression tests
        run: npm test

      - name: Validate test harness
        run: test -f tests/test.html
