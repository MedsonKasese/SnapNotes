<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>SnapNotes automated tests</title></head>
<body>
<h1>SnapNotes automated tests</h1>
<pre id="results">Running...</pre>
<script type="module" src="../js/attachments.js"></script>
<script type="module" src="../js/checklist-utils.js"></script>
<script src="../js/folders.js"></script>
<script src="../js/reminder-utils.js"></script>
<script src="../js/ai-format.js"></script>
<script src="../js/version-history.js"></script>
<script type="module" src="../js/drafts.js"></script>
<script type="module" src="../js/note-format.js"></script>
<script type="module">
import { buildPrivatePayload, lockedPrivateNote } from "../js/private-note-utils.js";
const results = [];
function test(name, fn) {
  try { fn(); results.push("PASS  " + name); }
  catch (error) { results.push("FAIL  " + name + " — " + error.message); }
}
const assert = (condition, message) => { if (!condition) throw new Error(message); };

test("localStorage is available", () => assert("localStorage" in window, "localStorage missing"));

test("recovery-draft APIs are available for the Library", () => {
  assert(typeof window.SnapNotesDrafts?.read === "function", "draft storage API is missing");
  assert(typeof window.SnapNotesDrafts?.upsert === "function", "draft save API is missing");
});

test("standalone double-asterisk lines render as subtitles", () => {
  const html = window.renderSubtitleMarkdownText("Intro\n**Next steps**");
  assert(html.includes('<h3 class="note-subtitle">Next steps</h3>'), "subtitle formatting is missing");
});

test("rich-text and one-line AI subtitle markup converts to a safe heading", () => {
  const richText = window.formatSubtitleMarkdownInHtml("<div>**Next steps**</div>");
  const oneLine = window.formatSubtitleMarkdownInHtml("**AI subtitle**");
  assert(richText.includes('<h3 class="note-subtitle">Next steps</h3>'), "rich-text subtitle conversion is missing");
  assert(oneLine.includes('<h3 class="note-subtitle">AI subtitle</h3>'), "one-line AI subtitle conversion is missing");
});

test("checklist tasks render as accessible, stateful checkbox controls", () => {
  const container = document.createElement("div");
  container.textContent = "☐ Pending task\n☑ Finished task";
  window.renderInteractiveChecklist(container, "note-1");
  const checkboxes = container.querySelectorAll('[data-checklist-toggle][role="checkbox"]');
  assert(checkboxes.length === 2, "checklist controls were not rendered");
  assert(checkboxes[0].getAttribute("aria-checked") === "false" && checkboxes[0].dataset.checklistIndex === "0", "incomplete item state or index is wrong");
  assert(checkboxes[1].getAttribute("aria-checked") === "true" && container.querySelectorAll(".checklist-item-text.is-complete").length === 1, "completed item styling or state is wrong");
});

test("attachment limits are defined", () => {
  assert(window.MAX_ATTACHMENTS_PER_NOTE === 5, "attachment count limit is incorrect");
  assert(window.MAX_ATTACHMENT_SIZE === 10 * 1024 * 1024, "attachment size limit is incorrect");
});

test("attachment module exposes note attachment preparation", () => {
  assert(typeof window.prepareNoteAttachments === "function", "attachment preparation API is missing");
  assert(typeof window.protectPrivateAttachmentsForPrivate === "function", "private attachment protection API is missing");
  assert(typeof window.duplicatePrivateAttachments === "function", "private attachment duplication API is missing");
});


test("signed-out users receive a sign-in gate before choosing files", () => {
  let clicked = false;
  const accepted = window.openAttachmentPicker({ click() { clicked = true; } });
  assert(accepted === false, "signed-out attachment picker should be blocked");
  assert(clicked === false, "file picker opened for a signed-out user");
});

test("attachment uploads can be retried after connectivity returns", () => {
  assert(typeof window.retryPendingAttachmentUploads === "function", "attachment retry API is missing");
});

test("attachment UI accepts supported file types", () => {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "image/jpeg,image/png,image/gif,image/webp,application/pdf,text/plain";
  assert(input.accept.includes("application/pdf") && input.accept.includes("image/png"), "attachment input types are incomplete");
});


test("folder module exposes folder management APIs", () => {
  assert(typeof window.createFolder === "function", "createFolder API is missing");
  assert(typeof window.moveNoteToFolder === "function", "moveNoteToFolder API is missing");
  assert(typeof window.getFolderById === "function", "getFolderById API is missing");
  assert(typeof window.customizeFolder === "function", "customizeFolder API is missing");
});

test("folder limits and names are bounded", () => {
  const name = "A".repeat(32);
  assert(name.length === 32, "folder name limit fixture is invalid");
  assert(localStorage.getItem("SnapNotesFolders") === null || Array.isArray(JSON.parse(localStorage.getItem("SnapNotesFolders"))), "folder storage shape is invalid");
});

test("custom folder icon and color choices are preserved and invalid values are reset", () => {
  const previous = localStorage.getItem("SnapNotesFolders");
  try {
    localStorage.setItem("SnapNotesFolders", JSON.stringify([
      { id: "folder-themed", name: "Research", icon: "book", color: "blue" },
      { id: "folder-legacy", name: "Legacy", icon: "<script>", color: "url(javascript:alert(1))" }
    ]));
    const folders = window.loadFolders();
    assert(folders[0].icon === "book" && folders[0].color === "blue", "folder appearance was not preserved");
    assert(folders[1].icon === "folder" && folders[1].color === "", "unrecognized appearance values were not rejected");
  } finally {
    if (previous === null) localStorage.removeItem("SnapNotesFolders");
    else localStorage.setItem("SnapNotesFolders", previous);
    window.loadFolders();
  }
});

test("notes can carry a folder id without changing categories", () => {
  const note = { id: "note-1", category: "work", folderId: "folder-1" };
  assert(note.category === "work" && note.folderId === "folder-1", "folder metadata is invalid");
});

test("folder view excludes archived, trashed, private, and unrelated notes", () => {
  const notes = [
    { id: "inside", folderId: "f1", archived: false, deletedAt: null, isPrivate: false },
    { id: "other", folderId: "f2", archived: false, deletedAt: null, isPrivate: false },
    { id: "archived", folderId: "f1", archived: true, deletedAt: null, isPrivate: false },
    { id: "trash", folderId: "f1", archived: false, deletedAt: new Date().toISOString(), isPrivate: false },
    { id: "private", folderId: "f1", archived: false, deletedAt: null, isPrivate: true }
  ];
  const visible = notes.filter(note => note.folderId === "f1" && !note.archived && !note.deletedAt && !note.isPrivate);
  assert(visible.length === 1 && visible[0].id === "inside", "folder visibility rules are incorrect");
});

test("folder sync payload keeps folders alongside notes", () => {
  const payload = { notes: [], folders: [{ id: "f1", name: "Work" }] };
  assert(Array.isArray(payload.folders) && payload.folders[0].name === "Work", "folder sync payload is invalid");
});

test("one-time reminder dates round-trip through local input helpers", () => {
  const source = "2026-10-08T09:15";
  const iso = window.parseReminderDateTimeLocal(source);
  assert(iso && window.formatReminderDateTimeLocal(iso) === source, "local reminder time was not preserved");
});

test("AI improvements preserve the existing title and remove app headings", () => {
  const result = window.normalizeAskMyNotesResult("#snapnotes\n## Original title\n\nImproved body.", "Original title");
  assert(result === "## Original title\n\nImproved body.", "AI Markdown title was not normalised");
});

test("AI improvements strip code fences without losing line breaks", () => {
  const result = window.normalizeAskMyNotesResult("```markdown\n#snapnotes\nNew body\n```", "My title");
  assert(result === "## My title\n\nNew body", "AI code-fenced output was not normalised");
});

test("AI improvements allow an edited title and normalize its heading", () => {
  const result = window.normalizeAskMyNotesResult("# Better title\n\nImproved body.", "Original title");
  assert(result === "## Better title\n\nImproved body.", "AI-edited title was not normalized");
});

test("attachment creation requires an authenticated account", () => {
  assert(window.prepareNoteAttachments.length >= 2, "attachment preparation API is incomplete");
});

test("crypto UUID support is available", () => assert(typeof crypto.randomUUID === "function", "crypto.randomUUID missing"));
test("service worker API is available", () => assert("serviceWorker" in navigator, "serviceWorker missing"));
test("online state is readable", () => assert(typeof navigator.onLine === "boolean", "navigator.onLine missing"));
test("search parser supports category syntax", () => {
  const q = "meeting category:work is:pinned sort:oldest";
  assert(q.includes("category:work") && q.includes("is:pinned") && q.includes("sort:oldest"), "search syntax unavailable");
});
test("JSON export shape is valid", () => {
  const payload = { app: "SnapNotes", version: 1, notes: [] };
  assert(payload.app === "SnapNotes" && Array.isArray(payload.notes), "invalid export shape");
});
test("share text uses real line breaks between title and body", () => {
  const shareText = `Title${"\n\n"}Body`;
  assert(shareText === "Title\n\nBody", "share text contains literal escape characters");
});
test("delete confirmation preference can disable confirmation", () => {
  localStorage.setItem("SnapNotesConfirmDelete", "false");
  assert(localStorage.getItem("SnapNotesConfirmDelete") === "false", "delete preference was not persisted");
  localStorage.removeItem("SnapNotesConfirmDelete");
});
test("note editing requires an action container in the note metadata", () => {
  const card = document.createElement("article");
  card.innerHTML = '<div class="note-card-top"></div><div class="note-card-meta"><div class="note-card-actions"></div></div>';
  assert(card.querySelector(".note-card-meta .note-card-actions"), "note action container is missing from metadata");
});
test("legacy note fixture includes a leading empty block before its title", () => {
  const wrapper = document.createElement("div");
  wrapper.innerHTML = "<p><br></p><p>## Note title</p><p>Body</p>";
  assert(wrapper.children[1].textContent === "## Note title", "legacy title fixture is invalid");
});

test("tag parser normalises and deduplicates tags", () => {
  const parseTags = value => [...new Set(String(value || "").split(",").map(tag => tag.trim().toLowerCase().replace(/^#/, "")).filter(Boolean))].slice(0, 10);
  assert(JSON.stringify(parseTags(" Work, #Ideas, work ")) === JSON.stringify(["work", "ideas"]), "tags were not normalised");
});

test("advanced search recognises tag and archive operators", () => {
  const query = 'project tag:work is:pinned -archived';
  assert(query.includes("tag:work") && query.includes("is:pinned") && query.includes("-archived"), "advanced search operators missing");
});

test("reminder due logic detects past reminders", () => {
  const now = Date.now();
  const due = new Date(now - 1000).toISOString();
  const future = new Date(now + 60000).toISOString();
  assert(Date.parse(due) <= now, "past reminder was not due");
  assert(Date.parse(future) > now, "future reminder was incorrectly due");
});

test("sync conflict contract preserves conflict metadata", () => {
  const source = { id: "note-1", title: "Plan", text: "Local", updatedAt: "2026-01-01T00:00:00.000Z" };
  const conflict = { ...source, id: "generated-id", title: "Conflict: Plan", syncConflict: true, conflictOf: "note-1" };
  assert(conflict.syncConflict === true && conflict.conflictOf === source.id && conflict.id !== source.id, "conflict copy is invalid");
});

test("note metadata contract supports tags and reminders", () => {
  const note = { id: "1", tags: ["work"], reminderAt: new Date().toISOString(), reminderNotified: false };
  assert(Array.isArray(note.tags), "tags must be an array");
  assert(typeof note.reminderAt === "string" && note.reminderNotified === false, "reminder fields are invalid");
});

test("search text includes tags", () => {
  const note = { title: "Trip", text: "budget", category: "work", tags: ["aviation", "research"] };
  const searchable = [note.title, note.text, note.category, ...note.tags].join(" ").toLowerCase();
  assert(searchable.includes("aviation") && searchable.includes("research"), "tags are not searchable");
});

test("edit history keeps a bounded snapshot list", () => {
  let history = [];
  for (let i = 0; i < 25; i++) {
    history = window.appendVersion(history, { title: "Note " + i, text: "Body " + i, html: "", category: "general", tags: [] });
  }
  assert(history.length === 20, "edit history exceeded the 20-version limit");
  assert(history[0].title === "Note 5" && history[19].title === "Note 24", "old versions were not trimmed correctly");
});

test("edit history records previous content before restore", () => {
  const note = { title: "Current", text: "Latest", html: "", category: "work", tags: ["project"] };
  const history = window.appendVersion([], note);
  assert(history.length === 1 && history[0].title === "Current" && history[0].text === "Latest", "version snapshot is invalid");
});

test("private edit history stays inside encrypted payload", () => {
  const payload = { title: "Private", text: "secret", history: [{ title: "Older", text: "secret older" }] };
  assert(Array.isArray(payload.history), "private history is missing");
  assert(!("versions" in { isPrivate: true, privateData: payload }), "private plaintext versions must not be stored beside encrypted data");
});

test("edit history is available from note actions", () => {
  const source = "edit history";
  assert(source === "edit history", "edit history action label is missing");
});

test("notification API permission is readable when supported", () => {
  if ("Notification" in window) {
    assert(["default", "granted", "denied"].includes(Notification.permission), "invalid notification permission state");
  }
});

test("reminder notifications use the service worker path", () => {
  const appSource = "navigator.serviceWorker.ready + registration.showNotification";
  assert(appSource.includes("serviceWorker.ready") && appSource.includes("showNotification"), "service worker notification path missing");
});

test("service worker handles reminder notification clicks", () => {
  const swSource = "notificationclick";
  assert(swSource.includes("notificationclick"), "notification click handler missing");
});

test("reminder notifications use the dedicated toolbar icon", () => {
  const iconPath = "./assets/icons/snapnotes-notification.png";
  assert(iconPath.endsWith(".png"), "raster notification icon path is missing");
});

test("update prompts are allowed inside installed PWAs", () => {
  const promptGuard = '(type === "install" && isSnapNotesInstalled())';
  assert(promptGuard.includes('type === "install"'), "update prompt is incorrectly blocked in installed mode");
});

test("service-worker update detection checks waiting and installing workers", () => {
  const updateContract = "registration.waiting + updatefound + statechange";
  assert(updateContract.includes("registration.waiting") && updateContract.includes("updatefound") && updateContract.includes("statechange"), "service-worker update lifecycle checks are incomplete");
});

test("reminder metadata has a stable notification state", () => {
  const note = { reminderAt: new Date().toISOString(), reminderNotified: false };
  assert(note.reminderAt && note.reminderNotified === false, "reminder state is invalid");
});

test("notification click routing carries a note id to the app", () => {
  const message = { type: "SNAPNOTES_OPEN_NOTE", noteId: "private-1" };
  assert(message.type === "SNAPNOTES_OPEN_NOTE" && message.noteId, "notification note routing payload is invalid");
});

test("private note detail requires an unlock gate", () => {
  const source = "rawNote.isPrivate && !window.isPrivateNotesUnlocked?.()";
  assert(source.includes("rawNote.isPrivate") && source.includes("isPrivateNotesUnlocked"), "private detail unlock gate is missing");
});

test("notification startup can retry after cloud notes load", () => {
  const hook = "window.handlePendingNotificationNote?.()";
  assert(hook.includes("handlePendingNotificationNote"), "cloud-load notification hook is missing");
});

test("private notes use an encrypted payload contract", () => {
  const note = {
    id: "private-1",
    isPrivate: true,
    title: "Private note",
    text: "",
    html: "",
    privateData: {
      version: 1,
      algorithm: "AES-GCM",
      kdf: "PBKDF2-SHA-256",
      iterations: 600000,
      salt: "salt",
      iv: "iv",
      ciphertext: "ciphertext"
    }
  };
  assert(note.isPrivate === true, "private flag is missing");
  assert(note.privateData.algorithm === "AES-GCM", "private data is not AES-GCM");
  assert(note.privateData.kdf === "PBKDF2-SHA-256", "private KDF is missing");
  assert(note.privateData.iterations === 600000, "private KDF work factor is invalid");
  assert(note.title === "Private note" && note.text === "" && note.html === "", "private plaintext should not be stored");
});

test("private notes module loads before the app controller", () => {
  const scripts = [
    "js/private-notes.js",
    "js/app.js"
  ];
  assert(scripts.indexOf("js/private-notes.js") < scripts.indexOf("js/app.js"), "private notes module must load before app.js");
});

test("private-note password dialog is visible when opened", () => {
  const modalClass = "auth-modal private-password-modal show";
  assert(modalClass.includes("show"), "private-note password dialog is hidden");
});

test("private notes are excluded from normal note visibility", () => {
  const notes = [
    { id: "public", isPrivate: false, deletedAt: null, archived: false },
    { id: "private", isPrivate: true, deletedAt: null, archived: false }
  ];
  const normal = notes.filter(note => !note.isPrivate && !note.deletedAt && !note.archived);
  const privateNotes = notes.filter(note => note.isPrivate && !note.deletedAt && !note.archived);
  assert(normal.length === 1 && normal[0].id === "public", "private note leaked into normal notes");
  assert(privateNotes.length === 1 && privateNotes[0].id === "private", "private note missing from private view");
});

test("private sharing requires an explicit public-copy warning", () => {
  const warning = "This will share a public copy of this private note.";
  assert(warning.includes("public copy") && warning.includes("private note"), "private sharing warning is missing");
});

test("locked private-note metadata is masked and included only in encryption payload", () => {
  const note = { isPrivate: true, reminderAt: "2026-10-15T09:00:00Z", reminderNotified: false, folderId: "secret-folder", attachments: [{ id: "a1", name: "secret.pdf" }] };
  const payload = buildPrivatePayload(note);
  const locked = lockedPrivateNote(note);
  assert(payload.reminderAt === note.reminderAt && payload.attachments[0].name === "secret.pdf", "private metadata was not preserved for encryption");
  assert(locked.reminderAt === null && locked.folderId === null && locked.attachments.length === 0, "locked note exposes private metadata");
});

document.getElementById("results").textContent = results.join("\n") + "\n\n" +
  (results.every(line => line.startsWith("PASS")) ? "ALL TESTS PASSED" : "SOME TESTS FAILED");
</script>
</body>
</html>
