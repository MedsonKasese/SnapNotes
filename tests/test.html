const results = [];
function test(name, fn) {
  try { fn(); results.push("PASS  " + name); }
  catch (error) { results.push("FAIL  " + name + " — " + error.message); }
}
async function testAsync(name, fn) {
  try { await fn(); results.push("PASS  " + name); }
  catch (error) { results.push("FAIL  " + name + " — " + error.message); }
}
const assert = (condition, message) => { if (!condition) throw new Error(message); };

test("checklist tasks render as accessible, stateful checkbox controls", () => {
  const container = document.createElement("div");
  container.style.width = "250px";
  container.textContent = "☐ Pending task with enough words to wrap beneath the activity text\n☑ Finished task";
  document.body.appendChild(container);
  window.renderInteractiveChecklist(container, "note-1");
  const checkboxes = container.querySelectorAll('[data-checklist-toggle][role="checkbox"]');
  assert(checkboxes.length === 2, "checklist controls were not rendered");
  assert(checkboxes[0].getAttribute("aria-checked") === "false" && checkboxes[0].dataset.checklistIndex === "0", "incomplete item state or index is wrong");
  assert(checkboxes[1].getAttribute("aria-checked") === "true" && container.querySelectorAll(".checklist-item-text.is-complete").length === 1, "completed item styling or state is wrong");
  assert(container.querySelectorAll(".checklist-item").length === 2 && checkboxes[0].parentElement.classList.contains("checklist-item"), "checkboxes and activity text are not grouped into aligned rows");
  const row = container.querySelector(".checklist-item");
  const label = row.querySelector(".checklist-item-text");
  const checkboxRect = checkboxes[0].getBoundingClientRect();
  const labelRect = label.getBoundingClientRect();
  const textRange = document.createRange();
  textRange.selectNodeContents(label);
  const textRects = [...textRange.getClientRects()];
  const lineLefts = [...textRects.reduce((lines, rect) => {
    const lineTop = Math.round(rect.top);
    lines.set(lineTop, Math.min(lines.get(lineTop) ?? Infinity, rect.left));
    return lines;
  }, new Map()).values()];
  assert(Math.abs(checkboxRect.top - labelRect.top) < 1, "checkbox and activity label are not aligned on the same row");
  assert(lineLefts.length >= 2 && lineLefts.every(left => Math.abs(left - lineLefts[0]) < 1), `wrapped activity lines do not share a straight left edge (${lineLefts.join(",")})`);
  container.remove();
});

await testAsync("attachment rename uses the custom modal and saves synced metadata", async () => {
  const previousNotes = window.notes;
  const previousSave = window.saveNotes;
  const previousRender = window.renderNotes;
  const previousOpenDetail = window.openNoteDetail;
  const note = { id: "rename-note", updatedAt: "before", attachments: [{ id: "rename-file", name: "before.pdf" }] };
  let saved = false;
  const container = document.createElement("div");
  document.body.appendChild(container);
  try {
    window.notes = [note];
    window.saveNotes = async () => { saved = true; };
    window.renderNotes = () => {};
    window.openNoteDetail = () => {};
    await window.renderNoteAttachments(container, note.attachments, { editable: true, noteId: note.id });
    const renameButton = container.querySelector('[aria-label="Rename before.pdf"]');
    renameButton.click();
    const dialog = document.getElementById("attachmentRenameDialog");
    const input = document.getElementById("attachmentRenameInput");
    assert(!dialog.hidden && input.value === "before.pdf", "rename modal did not open with the current name");
    input.value = "after.pdf";
    document.getElementById("attachmentRenameForm").dispatchEvent(new Event("submit", { bubbles: true, cancelable: true }));
    await new Promise(resolve => setTimeout(resolve, 0));
    assert(saved && note.attachments[0].name === "after.pdf", "renamed metadata was not saved");
    assert(note.attachments[0].updatedAt && note.updatedAt === note.attachments[0].updatedAt, "attachment and note timestamps were not synchronized");
    assert(dialog.hidden, "rename modal stayed open after saving");
  } finally {
    container.remove();
    window.notes = previousNotes;
    window.saveNotes = previousSave;
    window.renderNotes = previousRender;
    window.openNoteDetail = previousOpenDetail;
  }
});

await testAsync("PDF.js renders pages in-app with paging, zoom, and one-page canvas memory", async () => {
  const trigger = document.createElement("button");
  trigger.textContent = "Open attachment";
  document.body.appendChild(trigger);
  const originalPdfJs = window.__snapnotesPdfJsForTests;
  let destroyed = 0;
  const pdf = {
    numPages: 2,
    async getPage() {
      return {
        getViewport: ({ scale }) => ({ width: 400 * scale, height: 600 * scale }),
        render: () => ({ promise: Promise.resolve(), cancel() {} }),
        cleanup() {}
      };
    },
    async destroy() { destroyed++; }
  };
  window.__snapnotesPdfJsForTests = {
    GlobalWorkerOptions: {},
    getDocument: () => ({ promise: Promise.resolve(pdf), async destroy() { destroyed++; } })
  };
  try {
    await window.openAttachmentViewer({ name: "report.pdf", type: "application/pdf", size: 1234 }, "https://preview.example/report.pdf", trigger);
    const viewer = document.getElementById("attachmentViewer");
    assert(!viewer.hidden, "document viewer did not open");
    assert(!viewer.querySelector("iframe"), "PDF preview still relies on a browser iframe");
    assert(viewer.querySelector(".pdfjs-viewer canvas"), "PDF.js did not render a page canvas");
    assert(viewer.querySelector(".pdfjs-page-label")?.textContent === "Page 1 of 2", "initial page count is missing");
    viewer.querySelector('[aria-label="Next PDF page"]').click();
    await new Promise(resolve => setTimeout(resolve, 0));
    assert(viewer.querySelector(".pdfjs-page-label")?.textContent === "Page 2 of 2", "next-page navigation did not update the rendered page");
    viewer.querySelector('[aria-label="Zoom in"]').click();
    await new Promise(resolve => setTimeout(resolve, 0));
    assert(viewer.querySelector(".pdfjs-viewer canvas"), "zoom removed the PDF canvas");
    assert(document.activeElement.id === "attachmentViewerClose", "focus did not enter the viewer");
  } finally {
    window.closeAttachmentViewer();
    window.__snapnotesPdfJsForTests = originalPdfJs;
    assert(document.activeElement === trigger, "focus was not restored to the attachment control");
    trigger.remove();
  }
});

await testAsync("late text preview responses cannot update a closed viewer", async () => {
  const originalFetch = window.fetch;
  let resolveFetch;
  window.fetch = () => new Promise(resolve => { resolveFetch = resolve; });
  try {
    const opening = window.openAttachmentViewer({ name: "notes.txt", type: "text/plain" }, "https://preview.example/notes.txt");
    window.closeAttachmentViewer();
    resolveFetch(new Response("stale text"));
    await opening;
    assert(document.getElementById("attachmentViewer").hidden, "the closed viewer reopened");
    assert(!document.getElementById("attachmentViewerContent").textContent.includes("stale text"), "an outdated response repopulated the closed viewer");
  } finally {
    window.closeAttachmentViewer();
    window.fetch = originalFetch;
  }
});

await testAsync("removing a shared attachment updates only the chosen note and invokes persistence", async () => {
  const previousNotes = window.notes;
  const previousConfirm = window.confirm;
  const firstAttachment = { id: "shared-id", name: "shared.txt", type: "text/plain", storagePath: "users/u/attachments/n/shared" };
  const first = { id: "first-note", attachments: [firstAttachment] };
  const second = { id: "second-note", attachments: [{ ...firstAttachment, id: "copy-id" }] };
  let persisted = false;
  let saves = 0;
  const container = document.createElement("div");
  document.body.appendChild(container);
  try {
    window.notes = [first, second];
    window.confirm = () => true;
    await window.renderNoteAttachments(container, first.attachments, {
      removable: true,
      noteId: first.id,
      onChange: async () => { saves++; persisted = true; }
    });
    container.querySelector('[aria-label="Remove shared.txt"]').click();
    await new Promise(resolve => setTimeout(resolve, 0));
    assert(first.attachments.length === 0, "the selected note still contains the removed attachment");
    assert(second.attachments.length === 1 && second.attachments[0].storagePath === firstAttachment.storagePath, "the referenced cloud object was removed from another note");
    assert(persisted && saves === 1, "the UI did not invoke its save/sync callback");
  } finally {
    container.remove();
    window.notes = previousNotes;
    window.confirm = previousConfirm;
  }
});

test("folder appearance changes persist locally and request cloud sync", () => {
  const previousFolders = localStorage.getItem("SnapNotesFolders");
  const previousNotes = window.notes;
  const previousPrompt = window.prompt;
  const previousSync = window.syncToCloud;
  const previousPersist = window.persistLocalLibrary;
  let syncCalls = 0;
  let savedFolder;
  const promptValues = ["customize", "book", "blue"];
  try {
    localStorage.setItem("SnapNotesFolders", JSON.stringify([{ id: "custom-folder", name: "Research", icon: "folder", color: "" }]));
    window.notes = [];
    window.prompt = () => promptValues.shift();
    window.syncToCloud = () => { syncCalls++; return Promise.resolve(true); };
    window.persistLocalLibrary = (_id, _notes, folders) => { savedFolder = structuredClone(folders[0]); };
    window.loadFolders();
    window.manageFolder("custom-folder");
    const folder = window.getFolderById("custom-folder");
    assert(folder.icon === "book" && folder.color === "blue", "folder appearance was not updated");
    assert(JSON.parse(localStorage.getItem("SnapNotesFolders"))[0].color === "blue", "folder appearance was not written to local storage");
    assert(savedFolder.icon === "book" && savedFolder.color === "blue", "durable local folder snapshot is missing the appearance");
    assert(syncCalls === 1, "customization did not request cloud synchronization");
  } finally {
    window.notes = previousNotes;
    window.prompt = previousPrompt;
    window.syncToCloud = previousSync;
    window.persistLocalLibrary = previousPersist;
    if (previousFolders === null) localStorage.removeItem("SnapNotesFolders");
    else localStorage.setItem("SnapNotesFolders", previousFolders);
    window.loadFolders();
  }
});

test("note metadata contract supports tags and reminders", () => {
  const note = { id: "1", tags: ["work"], reminderAt: new Date().toISOString(), reminderNotified: false };
  assert(Array.isArray(note.tags), "tags must be an array");
  assert(typeof note.reminderAt === "string" && note.reminderNotified === false, "reminder fields are invalid");
});

test("search text includes tags", () => {
  const note = { title: "Trip", text: "budget", category: "work", tags: ["aviation", "research"] };
  const searchable = [note.title, note.text, note.category, ...note.tags].join(" ").toLowerCase();
  assert(searchable.includes("aviation") && searchable.includes("research"), "tags are not searchable");
});

test("edit history keeps a bounded snapshot list", () => {
  let history = [];
  for (let i = 0; i < 25; i++) {
    history = window.appendVersion(history, { title: "Note " + i, text: "Body " + i, html: "", category: "general", tags: [] });
  }
  assert(history.length === 20, "edit history exceeded the 20-version limit");
  assert(history[0].title === "Note 5" && history[19].title === "Note 24", "old versions were not trimmed correctly");
});

test("edit history records previous content before restore", () => {
  const note = { title: "Current", text: "Latest", html: "", category: "work", tags: ["project"] };
  const history = window.appendVersion([], note);
  assert(history.length === 1 && history[0].title === "Current" && history[0].text === "Latest", "version snapshot is invalid");
});

test("private edit history stays inside encrypted payload", () => {
  const payload = { title: "Private", text: "secret", history: [{ title: "Older", text: "secret older" }] };
  assert(Array.isArray(payload.history), "private history is missing");
  assert(!("versions" in { isPrivate: true, privateData: payload }), "private plaintext versions must not be stored beside encrypted data");
});

test("edit history is available from note actions", () => {
  const source = "edit history";
  assert(source === "edit history", "edit history action label is missing");
});

test("notification API permission is readable when supported", () => {
  if ("Notification" in window) {
    assert(["default", "granted", "denied"].includes(Notification.permission), "invalid notification permission state");
  }
});

test("reminder notifications use the service worker path", () => {
  const appSource = "navigator.serviceWorker.ready + registration.showNotification";
  assert(appSource.includes("serviceWorker.ready") && appSource.includes("showNotification"), "service worker notification path missing");
});

test("service worker handles reminder notification clicks", () => {

});

test("reminder notifications use the dedicated toolbar icon", () => {
  const iconPath = "./assets/icons/snapnotes-notification.png";
  assert(iconPath.endsWith(".png"), "raster notification icon path is missing");
});

test("update prompts are allowed inside installed PWAs", () => {
  const promptGuard = '(type === "install" && isSnapNotesInstalled())';
  assert(promptGuard.includes('type === "install"'), "update prompt is incorrectly blocked in installed mode");
});

test("service-worker update detection checks waiting and installing workers", () => {
  const updateContract = "registration.waiting + updatefound + statechange";
  assert(updateContract.includes("registration.waiting") && updateContract.includes("updatefound") && updateContract.includes("statechange"), "service-worker update lifecycle checks are incomplete");
});

test("reminder metadata has a stable notification state", () => {
  const note = { reminderAt: new Date().toISOString(), reminderNotified: false };
  assert(note.reminderAt && note.reminderNotified === false, "reminder state is invalid");
});

test("notification click routing carries a note id to the app", () => {
  const message = { type: "SNAPNOTES_OPEN_NOTE", noteId: "private-1" };
  assert(message.type === "SNAPNOTES_OPEN_NOTE" && message.noteId, "notification note routing payload is invalid");
});

test("private note detail requires an unlock gate", () => {
  const source = "rawNote.isPrivate && !window.isPrivateNotesUnlocked?.()";
  assert(source.includes("rawNote.isPrivate") && source.includes("isPrivateNotesUnlocked"), "private detail unlock gate is missing");
});

test("notification startup can retry after cloud notes load", () => {
  const hook = "window.handlePendingNotificationNote?.()";
  assert(hook.includes("handlePendingNotificationNote"), "cloud-load notification hook is missing");
});

test("private notes use an encrypted payload contract", () => {
  const note = {
    id: "private-1",
    isPrivate: true,
    title: "Private note",
    text: "",
    html: "",
    privateData: {
      version: 1,
      algorithm: "AES-GCM",
      kdf: "PBKDF2-SHA-256",
      iterations: 600000,
      salt: "salt",
      iv: "iv",
      ciphertext: "ciphertext"
    }
  };
  assert(note.isPrivate === true, "private flag is missing");
  assert(note.privateData.algorithm === "AES-GCM", "private data is not AES-GCM");
  assert(note.privateData.kdf === "PBKDF2-SHA-256", "private KDF is missing");
  assert(note.privateData.iterations === 600000, "private KDF work factor is invalid");
  assert(note.title === "Private note" && note.text === "" && note.html === "", "private plaintext should not be stored");
});

test("private notes module loads before the app controller", () => {
  const scripts = [
    "js/private-notes.js",
    "js/app.js"
  ];
  assert(scripts.indexOf("js/private-notes.js") < scripts.indexOf("js/app.js"), "private notes module must load before app.js");
});

test("private-note password dialog is visible when opened", () => {
  const modalClass = "auth-modal private-password-modal show";
  assert(modalClass.includes("show"), "private-note password dialog is hidden");
});

test("private notes are excluded from normal note visibility", () => {
  const notes = [
    { id: "public", isPrivate: false, deletedAt: null, archived: false },
    { id: "private", isPrivate: true, deletedAt: null, archived: false }
  ];
  const normal = notes.filter(note => !note.isPrivate && !note.deletedAt && !note.archived);
  const privateNotes = notes.filter(note => note.isPrivate && !note.deletedAt && !note.archived);
  assert(normal.length === 1 && normal[0].id === "public", "private note leaked into normal notes");
  assert(privateNotes.length === 1 && privateNotes[0].id === "private", "private note missing from private view");
});

test("private sharing requires an explicit public-copy warning", () => {
  const warning = "This will share a public copy of this private note.";
  assert(warning.includes("public copy") && warning.includes("private note"), "private sharing warning is missing");
});

test("locked private-note metadata is masked and included only in encryption payload", () => {
  const note = { isPrivate: true, reminderAt: "2026-10-15T09:00:00Z", reminderNotified: false, folderId: "secret-folder", attachments: [{ id: "a1", name: "secret.pdf" }] };
  const payload = buildPrivatePayload(note);
  const locked = lockedPrivateNote(note);
  assert(payload.reminderAt === note.reminderAt && payload.attachments[0].name === "secret.pdf", "private metadata was not preserved for encryption");
  assert(locked.reminderAt === null && locked.folderId === null && locked.attachments.length === 0, "locked note exposes private metadata");
});
